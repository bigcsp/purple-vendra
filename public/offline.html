<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>You're offline · Purple Shop</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fbf8ff; color: #1a1024; }
  main { max-width: 360px; text-align: center; }
  .mark { display: inline-flex; border: 3px solid #6d28d9; border-radius: 10px; overflow: hidden;
          font-weight: 800; font-size: 26px; line-height: 1; }
  .mark span { padding: 4px 8px 7px; }
  .mark .l { color: #6d28d9; }
  .mark .r { background: #6d28d9; color: #fff; font-weight: 300; }
  h1 { font-size: 22px; margin: 28px 0 8px; color: #3b0f6e; }
  p { color: #6b6478; line-height: 1.5; margin: 0; }
  button { margin-top: 24px; border: 0; border-radius: 999px; background: #6d28d9; color: #fff;
           font: inherit; font-weight: 600; padding: 12px 26px; cursor: pointer; }
  @media (prefers-color-scheme: dark) {
    body { background: #120b1c; color: #f1eafc; }
    h1 { color: #e9ddff; }
    p { color: #b5aac6; }
    .mark { border-color: #8b5cf6; }
    .mark .l { color: #c4b5fd; }
    .mark .r { background: #8b5cf6; }
    button { background: #8b5cf6; }
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-label="Purple Shop"><span class="l">purple</span><span class="r">shop</span></div>
  <h1>You're offline</h1>
  <p>Check your data or Wi-Fi, then try again. Your cart, saved items and messages are safe.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
