# Runs on every push and pull request: the same checks as on a laptop,
# so a broken build or a known-vulnerable package is caught before release.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Security audit (production packages)
        run: npm audit --omit=dev --audit-level=high

  # Supabase Edge Functions run on Deno, not Node, so they are excluded from
  # the Next.js type check (tsconfig.json) and checked here instead.
  # Separate job: it passes or fails independently of `check`.
  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno type check
        run: deno check --node-modules-dir=auto supabase/functions/*/index.ts

      - name: Bundle (proves imports resolve, as a deploy would)
        run: |
          for f in supabase/functions/*/index.ts; do
            deno bundle --node-modules-dir=auto --output "/tmp/$(basename "$(dirname "$f")").js" "$f"
          done
          ls -l /tmp/*.js
